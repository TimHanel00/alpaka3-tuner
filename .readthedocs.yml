# SPDX-License-Identifier: MPL-2.0
version: 2

formats:
  - htmlzip
  - pdf
  - epub
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      - doxygen docs/Doxyfile

sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
