# Default alpakaTune tuner configuration.
schema_version: 3
tuning:
  # offline, online_fixed, or online_adaptive
  mode: online_adaptive
  # Offline and post-completion online_fixed replay may opt into a production
  # path with no timing events, observations, or history bookkeeping.
  replay_fast_path: false
  # exhaustive, random, simulated_annealing, bayesian_optimization, or learned_hybrid
  strategy: exhaustive
  random_seed: 0
  # Hard cap; a record may retire earlier when its CI criterion is met or if it was retired by the Mann Whitney U test
  runs_per_candidate: 20
  # Defaults to runs_per_candidate, preserving fixed-budget measurements.
  minimum_runs_per_candidate: 1
  # 99 % non-parametric median CI controls - when does new best candidate configuration get retired
  ci_check_interval: 10
  ci_z_score: 2.576
  ci_relative_width: 0.05
  # Reject transient timing spikes from decision statistics, not raw history.
  outlier_mad_scale: 3.5
  # The Mann Whitney U test is used to draw comparisons between two candidates.
  # This is useful for search strategy and might also retire configurations early by comparing against the "best" solution
  mann_whitney_early_stop: true
  mann_whitney_min_samples: 8
  mann_whitney_alpha: 0.05
  # Bound consecutive rejected strategy proposals in one admission attempt.
  maximum_consecutive_strategy_retries: 20
  # online_adaptive-only revisit-probability and temperature horizon. It does
  # not terminate tuning. The surrounding application owns its run count.
  horizon: 40000
  # online_fixed-only alternative guard:
  # maximum_retired_configurations: 100000
  # Retain a rolling window per configuration independently of revisit count.
  history_window_size: 10
  revisit_admission_steepness: 16
  score_temperature_start: 0.25
  score_temperature_end: 0.05
  horizon_offset_with_active_history: 0.8
queue:
  # A present queue is active unless explicitly disabled. Remove this section
  # or set disable: true to launch accepted recommendations directly.
  disable: false
  # Run one configuration X times before recording measurements.
  warmup_runs: 1
  # Interleave this many distinct candidate configurations.
  noise_cancellation_window: 50
  # Consecutive launches per activation; must exceed warmup_runs.
  max_consecutive_runs: 2
history:
  file: .alpakaTune/history.json
  read: true
  write: true
  # Omit sample_count to persist every measured configuration.
  sample_count: 100
complete_history:
  file: .alpakaTune/complete-history.json
  read: true
  write: true
learning:
  # learned_hybrid uses the bundled model when model is omitted.
  fallback: random
  # Bound native model inference and candidate metadata independently of the
  # full Cartesian tuning-space size.
  candidate_pool_size: 4096
  candidate_batch_size: 256
